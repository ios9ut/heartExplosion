<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nút bấm kì lạ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const STAR_COUNT = 160;
            const FIREWORK_PARTICLES = 400; // nhiều hạt để tạo trái tim đẹp

            let width, height;
            let stars = [];
            const button = { x: 0, y: 0, radius: 70, visible: true };

            let state = 'idle'; // idle | exploding | forming | heart
            let particles = []; // CHÍNH các hạt này sẽ ghép thành trái tim
            let startTime = 0;
            const EXPLOSION_DURATION = 1.5;
            let formStartTime = 0;
            const FORM_DURATION = 1.2; // thời gian tụ về trái tim
            let nameAlpha = 0;
            let nameDir = 1;
            let gradientOffset = 0;

            const NAME = "Name"; // <-- Đổi tên

            // Bảng màu: xanh nước đậm + tím
            const COLORS = [
                '#0a2a8c', // xanh nước đậm
                '#1e3aff', // xanh lam
                '#2a4fd4', // xanh dương đậm
                '#4a1ecc', // tím
                '#7a3fff', // tím sáng
                '#5b2eff', // tím đậm
                '#0033cc', // xanh nước biển đậm
                '#00aaff'  // xanh sáng
            ];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                button.x = width / 2;
                button.y = height / 2;
                initStars();
            }

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        r: Math.random() * 1.4 + 0.4,
                        baseBright: Math.random() * 0.6 + 0.4,
                        speed: Math.random() * 0.02 + 0.004,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars() {
                const grad = ctx.createRadialGradient(
                    width/2, height/2, 0,
                    width/2, height/2, Math.max(width, height)/1.4
                );
                grad.addColorStop(0, '#060614');
                grad.addColorStop(0.6, '#03030c');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.phase += s.speed;
                    const tw = Math.sin(s.phase) * 0.25 + 0.75;
                    const alpha = s.baseBright * tw;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();

                    if (s.r > 1.1) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(150,180,255,${alpha * 0.12})`;
                        ctx.fill();
                    }
                }
            }

            function drawButton() {
                if (!button.visible) return;
                const bx = button.x, by = button.y, r = button.radius;

                const glow = ctx.createRadialGradient(bx, by, r * 0.5, bx, by, r * 2);
                glow.addColorStop(0, 'rgba(90,140,255,0.7)');
                glow.addColorStop(0.5, 'rgba(60,80,220,0.35)');
                glow.addColorStop(1, 'rgba(40,50,180,0)');
                ctx.beginPath();
                ctx.arc(bx, by, r * 2, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(bx, by, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,25,60,0.95)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(bx, by, r, 0, Math.PI * 2);
                ctx.strokeStyle = '#5a8cff';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#5a8cff';
                ctx.shadowBlur = 25;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.font = 'bold 22px Arial';
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#5a8cff';
                ctx.shadowBlur = 15;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('BẤM', bx, by);
                ctx.shadowBlur = 0;
            }

            // ==== Tạo pháo hoa + gán sẵn vị trí đích trên trái tim ====
            function createFireworks() {
                particles = [];
                const cx = button.x;
                const cy = button.y;

                // Kích thước trái tim LỚN để chứa tên
                const heartScale = Math.min(width, height) * 0.022;

                for (let i = 0; i < FIREWORK_PARTICLES; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 9;
                    const color = COLORS[Math.floor(Math.random() * COLORS.length)];

                    // ==== Tính vị trí đích trên trái tim cho hạt này ====
                    // Dùng tham số t trải đều quanh viền trái tim
                    const t = (i / FIREWORK_PARTICLES) * Math.PI * 2;
                    // depth: khoảng cách từ viền vào trong (độ dày trái tim)
                    // 0.75 -> 1.0 = mỏng vừa phải (không dày đặc, không 1 đường)
                    const depth = 0.72 + Math.random() * 0.28;

                    const hx = 16 * Math.pow(Math.sin(t), 3) * depth;
                    const hy = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * depth;

                    // Jitter nhẹ để tự nhiên
                    const jx = (Math.random() - 0.5) * 1.2;
                    const jy = (Math.random() - 0.5) * 1.2;

                    const targetX = cx + (hx + jx) * heartScale;
                    const targetY = cy - (hy + jy) * heartScale;

                    particles.push({
                        x: cx,
                        y: cy,
                        px: cx,
                        py: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: color,
                        life: 1.0,
                        decay: 0.35 + Math.random() * 0.35,
                        size: 1.8 + Math.random() * 1.8,
                        // vị trí bắt đầu (để tụ về)
                        startX: 0,
                        startY: 0,
                        // vị trí đích trên trái tim
                        targetX: targetX,
                        targetY: targetY,
                        // thời điểm bắt đầu tụ về (mỗi hạt hơi khác nhau)
                        formDelay: Math.random() * 0.3,
                        // lấp lánh
                        twinkle: Math.random() * Math.PI * 2,
                        twinkleSpeed: 0.03 + Math.random() * 0.05
                    });
                }

                state = 'exploding';
                startTime = performance.now() / 1000;
                button.visible = false;
            }

            function updateExplosion(dt) {
                const elapsed = performance.now() / 1000 - startTime;

                if (elapsed >= EXPLOSION_DURATION) {
                    // Chuyển sang giai đoạn tụ về
                    state = 'forming';
                    formStartTime = performance.now() / 1000;
                    // Lưu vị trí hiện tại làm điểm bắt đầu tụ
                    for (let i = 0; i < particles.length; i++) {
                        particles[i].startX = particles[i].x;
                        particles[i].startY = particles[i].y;
                    }
                    return;
                }

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.px = p.x;
                    p.py = p.y;
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.vx *= 0.97;
                    p.vy *= 0.97;
                    p.vy += 0.05;
                    p.life -= p.decay * dt;

                    if (p.life <= 0) continue;

                    // Trail
                    ctx.beginPath();
                    ctx.moveTo(p.px, p.py);
                    ctx.lineTo(p.x, p.y);
                    ctx.strokeStyle = p.color;
                    ctx.globalAlpha = p.life * 0.75;
                    ctx.lineWidth = p.size * 0.7;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.stroke();

                    // Đầu hạt
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();

                    // Tâm trắng
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = p.life * 0.9;
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            // ==== Tụ CHÍNH các hạt pháo hoa về trái tim ====
            function updateFormation(dt) {
                const elapsed = performance.now() / 1000 - formStartTime;
                const globalProgress = Math.min(1, elapsed / FORM_DURATION);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    // Mỗi hạt có delay riêng
                    const local = Math.min(1, Math.max(0, (globalProgress - p.formDelay) / (1 - p.formDelay)));
                    // Easing mượt
                    const eased = 1 - Math.pow(1 - local, 3);

                    // Nội suy từ startX/startY -> targetX/targetY
                    p.x = p.startX + (p.targetX - p.startX) * eased;
                    p.y = p.startY + (p.targetY - p.startY) * eased;

                    // Độ sáng tăng dần khi về đích
                    p.life = 0.5 + eased * 0.5;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                if (globalProgress >= 1) {
                    state = 'heart';
                }
            }

            function updateHeart(dt) {
                const cx = width / 2;
                const cy = height / 2;
                const time = performance.now() * 0.001;

                // Vẽ các hạt trái tim (chính là hạt pháo hoa cũ)
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.twinkle += p.twinkleSpeed;
                    const flicker = Math.sin(p.twinkle) * 0.3 + 0.7;

                    ctx.beginPath();
                    ctx.arc(p.targetX, p.targetY, p.size * (0.85 + flicker * 0.25), 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.globalAlpha = 0.65 + flicker * 0.35;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Fade in/out tên
                nameAlpha += nameDir * dt * 1.1;
                if (nameAlpha >= 1) { nameAlpha = 1; nameDir = -1; }
                else if (nameAlpha <= 0.15) { nameAlpha = 0.15; nameDir = 1; }

                // ==== Gradient ĐỘNG: xanh nước đậm + tím ====
                gradientOffset += dt * 0.35; // gradient chạy
                if (gradientOffset > 1) gradientOffset -= 1;

                // Dịch chuyển gradient theo thời gian
                const shift = Math.sin(time * 0.8) * 80;
                const grad = ctx.createLinearGradient(
                    cx - 200 + shift, cy - 60,
                    cx + 200 + shift, cy + 60
                );
                // Gradient chạy vòng: offset thay đổi vị trí các stop
                const o = gradientOffset;
                grad.addColorStop(0.0, '#0033cc');      // xanh nước đậm
                grad.addColorStop(0.2 + o * 0.2, '#1e3aff'); // xanh lam
                grad.addColorStop(0.4 + o * 0.2, '#4a1ecc'); // tím
                grad.addColorStop(0.6 + o * 0.2, '#7a3fff'); // tím sáng
                grad.addColorStop(0.8 + o * 0.2, '#0033cc'); // xanh nước đậm
                grad.addColorStop(1.0, '#0a2a8c');

                // ==== TÊN NHỎ HƠN ====
                const fontSize = Math.min(width * 0.075, height * 0.09, 62);
                ctx.font = `bold ${fontSize}px "Arial", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Lớp shadow
                ctx.globalAlpha = nameAlpha * 0.85;
                ctx.shadowColor = '#4a1ecc';
                ctx.shadowBlur = 35;
                ctx.fillStyle = grad;
                ctx.fillText(NAME, cx, cy + fontSize * 0.08);

                // Lớp sáng phía trước
                ctx.globalAlpha = nameAlpha * 0.45;
                ctx.shadowColor = '#1e3aff';
                ctx.shadowBlur = 55;
                ctx.fillStyle = '#aaccff';
                ctx.fillText(NAME, cx, cy + fontSize * 0.08);

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            let lastTime = performance.now() / 1000;

            function animate() {
                const now = performance.now() / 1000;
                const dt = Math.min(now - lastTime, 0.05);
                lastTime = now;

                ctx.clearRect(0, 0, width, height);
                drawStars();

                if (state === 'idle') {
                    drawButton();
                } else if (state === 'exploding') {
                    updateExplosion(dt);
                } else if (state === 'forming') {
                    updateFormation(dt);
                } else if (state === 'heart') {
                    updateHeart(dt);
                }

                requestAnimationFrame(animate);
            }

            canvas.addEventListener('click', (e) => {
                if (state !== 'idle') return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const dx = mx - button.x;
                const dy = my - button.y;
                if (Math.sqrt(dx*dx + dy*dy) <= button.radius && button.visible) {
                    createFireworks();
                }
            });

            window.addEventListener('resize', resize);
            resize();
            animate();
        })();
    </script>
</body>
</html>
